name: AvareX-EU Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: avarex-eu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and set release names
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Tag '$TAG' cannot be used safely in a release filename."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK_NAME=AvareX-EU-$TAG.apk" >> "$GITHUB_ENV"
          echo "SOURCE_BASENAME=AvareX-EU-$TAG-source" >> "$GITHUB_ENV"
          echo "CHANGELOG_NAME=CHANGELOG-$TAG.md" >> "$GITHUB_ENV"

      - name: Generate changelist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "# AvareX-EU $TAG"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "Changes since $PREVIOUS_TAG:"
              echo
              git log --no-merges --pretty='- %s (`%h`)' "$PREVIOUS_TAG..HEAD"
            else
              echo "Changes included in this release:"
              echo
              git log --no-merges --pretty='- %s (`%h`)' HEAD
            fi
          } > "dist/$CHANGELOG_NAME"

      - name: Create source archives
        shell: bash
        run: |
          set -euo pipefail
          STAGING="dist/$SOURCE_BASENAME"
          mkdir -p "$STAGING"
          git archive HEAD | tar -x -C "$STAGING"
          cp "dist/$CHANGELOG_NAME" "$STAGING/CHANGELOG-RELEASE.md"
          tar -C dist -czf "dist/$SOURCE_BASENAME.tar.gz" "$SOURCE_BASENAME"
          (cd dist && zip -qr "$SOURCE_BASENAME.zip" "$SOURCE_BASENAME")
          rm -rf "$STAGING"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.1'
          cache: true

      - name: Inject FAA service credential
        uses: richardrigutins/replace-in-files@v2
        with:
          files: '**/*.dart'
          search-text: '@@__faa_nms_api_client_id_secret__@@'
          replacement-text: ${{ secrets.FAA_NMS_API_CLIENT_ID_SECRET }}
          encoding: utf8
          max-parallelism: 10

      - name: Inject RevenueCat Android key
        uses: richardrigutins/replace-in-files@v2
        with:
          files: '**/*.dart'
          search-text: '@@___revenuecat_android_api_key__@@'
          replacement-text: ${{ secrets.ANDROID_REVENUECAT_API_KEY }}
          encoding: utf8
          max-parallelism: 10

      - name: Install project dependencies
        run: flutter pub get

      - name: Create non-production Firebase placeholders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          python3 - <<'PY'
          import json
          from pathlib import Path

          Path('android/app/google-services.json').write_text(json.dumps({
              'project_info': {
                  'project_number': '000000000000',
                  'project_id': 'avarex-eu-no-firebase',
                  'storage_bucket': 'avarex-eu-no-firebase.appspot.com',
              },
              'client': [{
                  'client_info': {
                      'mobilesdk_app_id': '1:000000000000:android:0000000000000000000000',
                      'android_client_info': {'package_name': 'com.apps4av.avaremp'},
                  },
                  'api_key': [{'current_key': 'not-a-real-firebase-key'}],
              }],
              'configuration_version': '1',
          }))

          Path('lib/firebase_options.dart').write_text('''
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/foundation.dart'
              show TargetPlatform, defaultTargetPlatform, kIsWeb;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) return web;
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                case TargetPlatform.macOS:
                  return macos;
                case TargetPlatform.windows:
                  return windows;
                default:
                  return android;
              }
            }

            static const android = FirebaseOptions(
              apiKey: 'not-a-real-firebase-key',
              appId: '1:000000000000:android:0000000000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'avarex-eu-no-firebase',
              storageBucket: 'avarex-eu-no-firebase.appspot.com',
            );
            static const ios = FirebaseOptions(
              apiKey: 'not-a-real-firebase-key',
              appId: '1:000000000000:ios:0000000000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'avarex-eu-no-firebase',
              storageBucket: 'avarex-eu-no-firebase.appspot.com',
              iosBundleId: 'com.apps4av.avaremp',
            );
            static const macos = ios;
            static const web = FirebaseOptions(
              apiKey: 'not-a-real-firebase-key',
              appId: '1:000000000000:web:0000000000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'avarex-eu-no-firebase',
              authDomain: 'avarex-eu-no-firebase.firebaseapp.com',
              storageBucket: 'avarex-eu-no-firebase.appspot.com',
            );
            static const windows = web;
          }
          ''')
          PY

      - name: Run tests and analyzer
        run: |
          flutter test
          flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Sign and name release APK
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KEY_STORE }}
          KEY_ALIAS: ${{ secrets.KEY_STORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASS }}
          KEY_PASSWORD: ${{ secrets.KEY_STORE_PASS }}
        run: |
          set -euo pipefail

          RELEASE_APK="build/app/outputs/apk/release/app-release.apk"
          if [[ ! -f "$RELEASE_APK" ]]; then
            echo "Expected release APK was not generated at $RELEASE_APK"
            find build/app/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          BUILD_TOOLS_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/34.0.0"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          if [[ ! -x "$ZIPALIGN" || ! -x "$APKSIGNER" ]]; then
            echo "Android build-tools 34.0.0 signing tools were not found in $BUILD_TOOLS_DIR"
            find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -maxdepth 2 -type f \( -name zipalign -o -name apksigner \) -print || true
            exit 1
          fi

          ALIGNED_APK="dist/AvareX-EU-$TAG-aligned.apk"
          "$ZIPALIGN" -f -p 4 "$RELEASE_APK" "$ALIGNED_APK"

          sign_apk() {
            local keystore="$1"
            local alias="$2"
            local storepass="$3"
            local keypass="$4"
            "$APKSIGNER" sign \
              --ks "$keystore" \
              --ks-key-alias "$alias" \
              --ks-pass "pass:$storepass" \
              --key-pass "pass:$keypass" \
              --out "dist/$APK_NAME" \
              "$ALIGNED_APK"
          }

          KEYSTORE="${RUNNER_TEMP:-/tmp}/avarex-eu-release.jks"
          if [[ -n "$SIGNING_KEY_BASE64" && -n "$KEY_ALIAS" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_PASSWORD" ]]; then
            if printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode --ignore-garbage > "$KEYSTORE" \
                && sign_apk "$KEYSTORE" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD"; then
              echo "Signed APK with repository signing key."
            else
              echo "Repository Android signing secrets are present but could not sign the APK; using generated GitHub-release signing key."
              rm -f "dist/$APK_NAME" "$KEYSTORE"
            fi
          else
            echo "Repository Android signing secrets are incomplete; using generated GitHub-release signing key."
          fi

          if [[ ! -f "dist/$APK_NAME" ]]; then
            FALLBACK_KEYSTORE="${RUNNER_TEMP:-/tmp}/avarex-eu-release-generated.jks"
            FALLBACK_ALIAS="avarex-eu-release"
            FALLBACK_PASSWORD="avarex-eu-release-pass"
            keytool -genkeypair \
              -keystore "$FALLBACK_KEYSTORE" \
              -storepass "$FALLBACK_PASSWORD" \
              -keypass "$FALLBACK_PASSWORD" \
              -alias "$FALLBACK_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AvareX EU GitHub Release, O=AvareX, C=US"
            sign_apk "$FALLBACK_KEYSTORE" "$FALLBACK_ALIAS" "$FALLBACK_PASSWORD" "$FALLBACK_PASSWORD"
            rm -f "$FALLBACK_KEYSTORE"
          fi

          "$APKSIGNER" verify --verbose --print-certs "dist/$APK_NAME"
          rm -f "$KEYSTORE" "$ALIGNED_APK"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: AvareX-EU ${{ github.ref_name }}
          body_path: dist/${{ env.CHANGELOG_NAME }}
          files: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.SOURCE_BASENAME }}.tar.gz
            dist/${{ env.SOURCE_BASENAME }}.zip
            dist/${{ env.CHANGELOG_NAME }}
          fail_on_unmatched_files: true
