name: AvareX-EU Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: avarex-eu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and set release names
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Tag '$TAG' cannot be used safely in a release filename."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK_NAME=AvareX-EU-$TAG.apk" >> "$GITHUB_ENV"
          echo "SOURCE_BASENAME=AvareX-EU-$TAG-source" >> "$GITHUB_ENV"
          echo "CHANGELOG_NAME=CHANGELOG-$TAG.md" >> "$GITHUB_ENV"

      - name: Generate changelist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "# AvareX-EU $TAG"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "Changes since $PREVIOUS_TAG:"
              echo
              git log --no-merges --pretty='- %s (`%h`)' "$PREVIOUS_TAG..HEAD"
            else
              echo "Changes included in this release:"
              echo
              git log --no-merges --pretty='- %s (`%h`)' HEAD
            fi
          } > "dist/$CHANGELOG_NAME"

      - name: Create source archives
        shell: bash
        run: |
          set -euo pipefail
          STAGING="dist/$SOURCE_BASENAME"
          mkdir -p "$STAGING"
          git archive HEAD | tar -x -C "$STAGING"
          cp "dist/$CHANGELOG_NAME" "$STAGING/CHANGELOG-RELEASE.md"
          tar -C dist -czf "dist/$SOURCE_BASENAME.tar.gz" "$SOURCE_BASENAME"
          (cd dist && zip -qr "$SOURCE_BASENAME.zip" "$SOURCE_BASENAME")
          rm -rf "$STAGING"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.1'
          cache: true

      - name: Inject FAA service credential
        uses: richardrigutins/replace-in-files@v2
        with:
          files: '**/*.dart'
          search-text: '@@__faa_nms_api_client_id_secret__@@'
          replacement-text: ${{ secrets.FAA_NMS_API_CLIENT_ID_SECRET }}
          encoding: utf8
          max-parallelism: 10

      - name: Inject RevenueCat Android key
        uses: richardrigutins/replace-in-files@v2
        with:
          files: '**/*.dart'
          search-text: '@@___revenuecat_android_api_key__@@'
          replacement-text: ${{ secrets.ANDROID_REVENUECAT_API_KEY }}
          encoding: utf8
          max-parallelism: 10

      - name: Install project dependencies
        run: flutter pub get

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Generate Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          npm install -g firebase-tools@15.22.1
          printf '%s' '${{ secrets.GOOGLE_SERVICES_KEY }}' | base64 -d > key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/key.json"
          dart pub global activate flutterfire_cli
          flutterfire configure --project avarex-479ae --platforms android --yes < /dev/null
          rm -f key.json

      - name: Run tests and analyzer
        run: |
          flutter test
          flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Sign release APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: build/app/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEY_STORE }}
          alias: ${{ secrets.KEY_STORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASS }}
          keyPassword: ${{ secrets.KEY_STORE_PASS }}
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      - name: Name release APK
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.sign_apk.outputs.signedReleaseFile }}" "dist/$APK_NAME"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: AvareX-EU ${{ github.ref_name }}
          body_path: dist/${{ env.CHANGELOG_NAME }}
          files: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.SOURCE_BASENAME }}.tar.gz
            dist/${{ env.SOURCE_BASENAME }}.zip
            dist/${{ env.CHANGELOG_NAME }}
          fail_on_unmatched_files: true
